<div class="page-container">
  <header class="page-header">
    <h1>{{ 'activities.title' | translate }}</h1>
    <p>{{ 'activities.subtitle' | translate }}</p>
  </header>

  <div class="cards-grid">
    @for (activity of activities(); track activity.id) {
    <app-card
      [title]="activity.title"
      [subtitle]="('activities.author' | translate) + ': ' + activity.author"
      [hoverable]="true"
    >
      <p class="description">{{ activity.description }}</p>
      <div class="meta-row">
        <app-badge variant="primary">{{ activity.category }}</app-badge>
        <span>
          <mat-icon inline>group</mat-icon>
          {{ activity.minParticipants }}-{{ activity.maxParticipants }}
        </span>
        <span>
          <mat-icon inline>schedule</mat-icon>
          {{ activity.durationMinutes }}m
        </span>
      </div>
    </app-card>
    }
  </div>
</div>
