<div class="page-container">
  <header class="page-header">
    <div>
      <h1>{{ 'resources.foodTitle' | translate }}</h1>
      <p>{{ 'resources.foodSubtitle' | translate }}</p>
    </div>
  </header>

  <div class="cards-grid">
    @for (food of foodTypes(); track food.id) {
      <app-card [title]="food.name" [subtitle]="food.nameEnglish" [hoverable]="true">
        <div class="card-footer">
          <span class="price">{{ food.price | currency: 'DKK ' }}</span>
          <button mat-raised-button color="primary" (click)="orderFood(food)">
            <mat-icon>shopping_bag</mat-icon> {{ 'resources.orderFood' | translate }}
          </button>
        </div>
      </app-card>
    }
  </div>
</div>
