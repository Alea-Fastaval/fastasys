<div class="page-container">
  <header class="page-header">
    <div>
      <h1>{{ 'resources.wearTitle' | translate }}</h1>
      <p>{{ 'resources.wearSubtitle' | translate }}</p>
    </div>
  </header>

  <div class="cards-grid">
    @for (wear of wearItems(); track wear.id) {
      <app-card [title]="wear.name" [subtitle]="wear.description" [hoverable]="true">
        <div class="card-footer">
          <button mat-raised-button color="primary" (click)="orderWear(wear)">
            <mat-icon>shopping_bag</mat-icon> {{ 'resources.orderWear' | translate }}
          </button>
        </div>
      </app-card>
    }
  </div>
</div>
