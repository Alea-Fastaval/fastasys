<div class="page-container">
  <header class="page-header">
    <div>
      <h1>{{ 'resources.roomsTitle' | translate }}</h1>
      <p>{{ 'resources.roomsSubtitle' | translate }}</p>
    </div>
  </header>

  <div class="cards-grid">
    @for (room of rooms(); track room.id) {
      <app-card [title]="room.name" [subtitle]="room.location" [hoverable]="true">
        <div class="card-footer">
          <span class="capacity">{{ 'resources.capacity' | translate }}: {{ room.capacity }}</span>
          <span class="size">{{ 'resources.size' | translate }}: {{ room.size }}</span>
        </div>
      </app-card>
    }
  </div>
</div>
